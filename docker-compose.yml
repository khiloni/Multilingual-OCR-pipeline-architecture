# DocScribe Multi-Service Local Development Orchestration
# Purpose: Define and run containers for backend, worker, frontend, postgres, redis, and minio.
# Future TODOs: Configure GPU/CUDA support mapping for surya-engine worker container in production environments.

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: docscribe_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-docscribe}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - docscribe_net

  redis:
    image: redis:7-alpine
    container_name: docscribe_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docscribe_net

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: docscribe_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - docscribe_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-api.txt
    container_name: docscribe_backend
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
     - ./backend/app:/app/app
    networks:
      - docscribe_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-worker.txt
    container_name: docscribe_worker
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - PADDLEOCR_REC_MODEL_DIR=/app/model/paddle/inference/rec_finetuned
    depends_on:
      - redis
      - postgres
      - minio
    networks:
      - docscribe_net
    volumes:
      - ./backend/app:/app/app
      - ./backend/worker:/app/worker
      - ./evaluation:/app/evaluation
      - paddlex_cache:/root/.paddlex
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
      - ./model/paddle/inference/rec_finetuned:/app/model/paddle/inference/rec_finetuned:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docscribe_frontend
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    networks:
      - docscribe_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  paddlex_cache:
  hf_cache:
  torch_cache:

networks:
  docscribe_net:
    driver: bridge
